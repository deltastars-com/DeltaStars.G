apply plugin: 'com.android.application'

android {
    namespace = "com.deltastars.store"
    compileSdk = rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.deltastars.store"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Support: env vars (GitHub Actions), gradle properties (CodeMagic), or local.properties
            def ksPath = System.getenv('KEYSTORE_PATH') ?: project.findProperty('KEYSTORE_PATH') ?: ''
            def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('KEYSTORE_PASSWORD') ?: ''
            def ksAlias = System.getenv('KEY_ALIAS') ?: project.findProperty('KEY_ALIAS') ?: ''
            def ksKeyPass = System.getenv('KEY_PASSWORD') ?: project.findProperty('KEY_PASSWORD') ?: ''

            // Fallback: try reading from local.properties file
            if (!ksPath) {
                try {
                    def props = new Properties()
                    props.load(new FileInputStream(rootProject.file('local.properties')))
                    ksPath = props.getProperty('KEYSTORE_PATH', '')
                    ksPass = props.getProperty('KEYSTORE_PASSWORD', '')
                    ksAlias = props.getProperty('KEY_ALIAS', '')
                    ksKeyPass = props.getProperty('KEY_PASSWORD', '')
                } catch (Exception ignored) {}
            }

            if (ksPath && ksPass && ksAlias && ksKeyPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds use default debug signing
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Apply signing config if available
            if (android.signingConfigs.release.storeFile) {
                signingConfig android.signingConfigs.release
            }
        }
    }

    // Ensure APK output is clean
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "DeltaStars-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
