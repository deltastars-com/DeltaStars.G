workflows:

  # ═══════════════════════════════════════════════
  # Android — APK + AAB
  # ═══════════════════════════════════════════════
  android-release:
    name: "🤖 Delta Stars — Android Release"
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - deltastars_android
      vars:
        PACKAGE_NAME: "com.deltastars.store"
        GOOGLE_PLAY_TRACK: "internal"
      java: 21
      node: 20

    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: "📦 Install dependencies"
        script: |
          npm install -g bun
          bun install --frozen-lockfile

      - name: "🔨 Build web app"
        script: bun run build:web

      - name: "🔄 Sync Capacitor"
        script: |
          npx cap sync android
          echo "Capacitor sync complete"

      - name: "🔑 Setup signing keystore"
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/keystore.jks
          echo "KEYSTORE_PATH=$CM_BUILD_DIR/keystore.jks" >> android/local.properties
          echo "KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> android/local.properties
          echo "KEY_ALIAS=$CM_KEY_ALIAS" >> android/local.properties
          echo "KEY_PASSWORD=$CM_KEY_PASSWORD" >> android/local.properties

      - name: "🏗️ Build Android AAB (Play Store)"
        script: |
          cd android
          ./gradlew bundleRelease \
            -PKEYSTORE_PATH=$CM_BUILD_DIR/keystore.jks \
            -PKEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD \
            -PKEY_ALIAS=$CM_KEY_ALIAS \
            -PKEY_PASSWORD=$CM_KEY_PASSWORD

      - name: "📱 Build Android APK (Direct Install)"
        script: |
          cd android
          ./gradlew assembleRelease \
            -PKEYSTORE_PATH=$CM_BUILD_DIR/keystore.jks \
            -PKEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD \
            -PKEY_ALIAS=$CM_KEY_ALIAS \
            -PKEY_PASSWORD=$CM_KEY_PASSWORD

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - INFO@DELTASTARS-KSA.COM
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true
      github:
        artifact_patterns:
          - "*.apk"
          - "*.aab"

  # ═══════════════════════════════════════════════
  # iOS — IPA
  # ═══════════════════════════════════════════════
  ios-release:
    name: "🍎 Delta Stars — iOS Release"
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - deltastars_ios
      vars:
        BUNDLE_ID: "com.deltastars.store"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: 20

    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: "📦 Install dependencies"
        script: |
          npm install -g bun
          bun install --frozen-lockfile

      - name: "🔨 Build web app"
        script: bun run build:web

      - name: "🔄 Sync Capacitor"
        script: npx cap sync ios

      - name: "🍫 Install CocoaPods"
        script: |
          cd ios/App
          pod install --repo-update

      - name: "🔑 iOS Code Signing"
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: "🏗️ Build iOS IPA"
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - INFO@DELTASTARS-KSA.COM
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      github:
        artifact_patterns:
          - "*.ipa"
