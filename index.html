  <script>
    // Suppress benign sandbox WebSocket/HMR errors
    window.addEventListener('error', function(e) {
      var msg = (e.message || '').toLowerCase();
      var errorSource = (e.filename || '');
      if (
        msg.includes('websocket') ||
        msg.includes('vite') ||
        msg.includes('failed to fetch') ||
        errorSource.includes('_ai_studio_iframe.js')
      ) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason;
      var reasonStr = '';
      if (reason) {
        reasonStr = typeof reason === 'string' ? reason : (reason.message || reason.stack || '');
      }
      reasonStr = reasonStr.toLowerCase();
      if (
        reasonStr.includes('websocket') ||
        reasonStr.includes('failed to fetch') ||
        reasonStr.includes('vite') ||
        reasonStr.includes('closed without opened')
      ) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    }, true);

    // Safe global Storage polyfill for restricted sandboxes
    (function() {
      var mockStoreLocal = {};
      var mockStoreSession = {};

      function createSafeStorageMock(mockStore) {
        return {
          getItem: function(key) {
            return Object.prototype.hasOwnProperty.call(mockStore, key) ? mockStore[key] : null;
          },
          setItem: function(key, value) {
            mockStore[key] = String(value);
          },
          removeItem: function(key) {
            delete mockStore[key];
          },
          clear: function() {
            for (var k in mockStore) {
              if (Object.prototype.hasOwnProperty.call(mockStore, k)) {
                delete mockStore[k];
              }
            }
          },
          key: function(index) {
            var keys = Object.keys(mockStore);
            return keys[index] || null;
          },
          get length() {
            return Object.keys(mockStore).length;
          }
        };
      }

      var safeLocal = null;
      try {
        var testKey = '__ds_storage_test__';
        window.localStorage.setItem(testKey, 'ok');
        window.localStorage.removeItem(testKey);
        safeLocal = window.localStorage;
      } catch (e) {
        safeLocal = createSafeStorageMock(mockStoreLocal);
      }

      var safeSession = null;
      try {
        var testKey = '__ds_session_test__';
        window.sessionStorage.setItem(testKey, 'ok');
        window.sessionStorage.removeItem(testKey);
        safeSession = window.sessionStorage;
      } catch (e) {
        safeSession = createSafeStorageMock(mockStoreSession);
      }

      function overrideProperty(target, propName, safeValue) {
        if (!safeValue || safeValue === target[propName]) return;
        try { delete target[propName]; } catch(err) {}
        try {
          Object.defineProperty(target, propName, {
            get: function() { return safeValue; },
            set: function() { },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try { target[propName] = safeValue; } catch(e) {}
        }
      }

      if (safeLocal !== window.localStorage) {
        overrideProperty(window, 'localStorage', safeLocal);
      }
      if (safeSession !== window.sessionStorage) {
        overrideProperty(window, 'sessionStorage', safeSession);
      }
    })();

    // Chunk load error recovery - clear caches and reload
    window.addEventListener('error', function(e) {
      var errorText = (e.message || '').toLowerCase();
      var isChunkError = errorText.includes('chunk') ||
                         errorText.includes('failed to fetch dynamically imported module') ||
                         errorText.includes('unexpected token') ||
                         (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') && e.target.src && e.target.src.includes('.js'));

      if (isChunkError) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) { reg.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
        try { localStorage.removeItem('ds_current_page'); } catch(err) {}
        setTimeout(function() { window.location.reload(); }, 400);
      }
    }, true);

    // Failsafe: dismiss boot splash after 2.5s
    setTimeout(function() {
      var splash = document.getElementById('delta-critical-boot-splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          try { splash.remove(); } catch (err) { splash.style.display = 'none'; }
        }, 500);
      }
    }, 2500);
  </script>

  <!-- Critical Boot Splash -->
  <style>
    #delta-critical-boot-splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #0d240d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: 'Tajawal', sans-serif;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #delta-critical-boot-splash.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .splash-circle-pulse {
      position: absolute;
      width: 160px; height: 160px;
      border: 3px solid rgba(255, 146, 43, 0.4);
      border-radius: 50%;
      animation: splash-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .splash-logo-card {
      width: 124px; height: 124px;
      background-color: #ffffff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #fbbf24;
      padding: 3px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px rgba(251,191,36,0.5);
      z-index: 10;
      overflow: hidden;
    }
    .splash-logo-card img {

      height: 100%;
      object-fit: contain;
      border-radius: 20px;
    }
    .splash-brand-title {
      font-size: 26px;
      font-weight: 900;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 0px #78350F) drop-shadow(0px 4px 10px rgba(0,0,0,0.9));
      text-shadow: 0 1px 0 #d97706, 0 2px 0 #b45309, 0 3px 5px rgba(0,0,0,0.8);
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      text-align: center;
    }
    .splash-brand-subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #fef3c7;
      margin-bottom: 12px;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
      padding: 0 16px;
    }
    .splash-welcome-badge {
      font-size: 14px;
      font-weight: 900;
      color: #022c22;
      background: linear-gradient(90deg, #f59e0b, #fde047, #f59e0b);
      padding: 4px 18px;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(251,191,36,0.5);
      border: 1px solid #fef08a;
      margin-bottom: 24px;
    }
    .splash-spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #FF922B;
      border-radius: 50%;
      animation: splash-spin 1s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes splash-ping {
      75%, 100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }
